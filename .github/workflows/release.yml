name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.2'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::'$version' is not a valid version. Use numbers separated by dots, for example 1.2 or 1.2.3."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Fail if the tag already exists
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.check.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.check.outputs.tag }} already exists."
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore PhotoSort.slnx

      - run: dotnet build PhotoSort.slnx --configuration Release --no-restore

      - run: dotnet test PhotoSort.slnx --configuration Release --no-build --verbosity normal

  publish:
    name: Publish ${{ matrix.label }}
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   label: windows-x64 }
          - { os: windows-latest, rid: win-x86,   label: windows-x86 }
          - { os: ubuntu-latest,  rid: linux-x64, label: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Self-contained: the .NET runtime and every native dependency live inside the executable,
      # so the target machine needs nothing installed.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/PhotoSort/PhotoSort.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version=${{ needs.validate.outputs.version }} \
            --output staging

      - name: Add documentation to the package
        shell: bash
        run: |
          cp README.md staging/
          mkdir -p staging/docs
          cp docs/technical-specification.md staging/docs/
          ls -la staging

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path staging/* -DestinationPath "PhotoSort-${{ needs.validate.outputs.version }}-${{ matrix.label }}.zip"

      # Info-ZIP keeps the executable bit, which the Linux build needs to start after unzipping.
      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x staging/PhotoSort
          cd staging
          zip -r "../PhotoSort-${{ needs.validate.outputs.version }}-${{ matrix.label }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-${{ matrix.label }}
          path: PhotoSort-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true

      - name: List artifacts
        run: ls -la downloads

      - name: Write release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Download

          | Package | For |
          |---------|-----|
          | \`PhotoSort-${VERSION}-windows-x64.zip\` | Windows 10 / 11, 64-bit |
          | \`PhotoSort-${VERSION}-windows-x86.zip\` | Windows 10 / 11, 32-bit |
          | \`PhotoSort-${VERSION}-linux-x64.zip\` | Linux, 64-bit |

          ## Installation

          Download the archive, unpack it and run the executable. **No .NET installation is
          required** — the runtime and every native dependency sit inside the executable.

          - **Windows:** run \`PhotoSort.exe\`.
          - **Linux:** run \`./PhotoSort\` (if needed, \`chmod +x PhotoSort\` first).

          ## Requirements

          - **Windows 10 (1607 or newer) or Windows 11.** Windows 7 and 8.1 are not supported:
            no .NET release since 6 runs on them, and self-contained publishing cannot change that.
          - **Linux:** a normal desktop installation. The usual \`libicu\`, \`libfontconfig1\`,
            \`libx11-6\`, \`libice6\` and \`libsm6\` packages must be present; they ship with every
            mainstream distribution.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.validate.outputs.tag }}" downloads/*.zip \
            --title "PhotoSort ${{ needs.validate.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }}
